spring:
  application:
    name: redis-rate-limit-poc
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 16
          max-idle: 8

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.example.ratelimit: INFO
    # Tomcat/coyote header DEBUG is deliberately OFF. It prints Authorization,
    # Cookie and query values verbatim, which would write HTTP Basic credentials
    # and session cookies to backend.log in plaintext. AccessLogFilter already emits
    # a structured line per request with method, route template, outcome and latency,
    # so nothing is lost by leaving this at INFO.
    org.apache.catalina.connector.CoyoteAdapter: INFO
    org.apache.coyote.http11.Http11InputBuffer: INFO

rate-limit:
  enabled: true
  key-prefix: rate-limit:v1
  # Empty means X-Forwarded-For / X-Real-IP are ignored entirely and the socket peer is used.
  # Populate only with the CIDRs of reverse proxies you actually operate, e.g. ["10.0.0.0/8"].
  trusted-proxies: []
  # Administrator for /api/admin/**. No default: leave these unset and the control plane rejects
  # every caller. Supply them from the environment, never in this file:
  #   RATELIMIT_ADMIN_USER / RATELIMIT_ADMIN_PASSWORD
  admin:
    username: ${RATELIMIT_ADMIN_USER:}
    password: ${RATELIMIT_ADMIN_PASSWORD:}
    raw-password: true
  # Fixed control-plane throttle for /api/admin/** and /api/poc/**, per client IP, applied BEFORE
  # Spring Security so failed logins are counted. Config-only: not a managed policy, so it cannot be
  # viewed, edited or disabled through the admin API/UI. Fails closed (503) if Redis is down.
  admin-protection:
    enabled: true
    limit: 300           # control-plane requests per window per IP (console polls ~1/s as a fallback)
    window: 1m
    # Failed Basic logins (bad credentials, on ANY path) per IP. Requests with no credentials never count
    # and are never blocked by the lockout.
    max-auth-failures: 10  # failures within `failure-window` before the IP is locked
    failure-window: 10m
    lockout: 5m            # full lock duration (429 + Retry-After = time remaining)
  # Used when Redis is unreachable; individual policies may override.
  on-redis-error: fail_open
  ttl-grace: 1s
  excluded-paths:
    - /actuator/**
    - /error
  excluded-methods:
    - OPTIONS
    - HEAD
  policies:
    - id: products-read
      method: GET
      path: /api/products
      limit: 100
      window: 60s
      identity: IP
    - id: login-attempt
      method: POST
      path: /api/login
      limit: 10
      window: 60s
      identity: IP
      # Credential endpoints fail closed: a lost Redis must not become unlimited logins.
      on-redis-error: fail_closed
    - id: order-create
      method: POST
      path: /api/orders
      limit: 30
      window: 60s
      identity: USER
